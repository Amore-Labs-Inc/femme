[package]
name = "femme-store"
description = "SQLite state: rev-based rows, tombstones, blobs, retention, JSON import."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
femme-proto.workspace = true
# fallible_uint: u64 binds/reads as INTEGER (error instead of wrap-around past i64::MAX).
rusqlite = { workspace = true, features = ["fallible_uint"] }
serde.workspace = true
serde_json.workspace = true
postcard.workspace = true
zstd.workspace = true
thiserror.workspace = true
tracing.workspace = true
sha2 = "0.11"

[dev-dependencies]
tempfile = "3"
