name: mobile
on:
  push:
    branches: [main]
    paths: ["mobile/app/**", ".github/workflows/mobile.yml"]
  pull_request:
    paths: ["mobile/app/**", ".github/workflows/mobile.yml"]
  workflow_dispatch:

env:
  FLUTTER_VERSION: 3.47.7

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
        working-directory: mobile/app
      - run: dart format --output=none --set-exit-if-changed lib test
        working-directory: mobile/app
      - run: flutter analyze
        working-directory: mobile/app
      - run: flutter test
        working-directory: mobile/app

  android:
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter build apk --release
        working-directory: mobile/app
      - uses: actions/upload-artifact@v4
        with:
          name: femme-android
          path: mobile/app/build/app/outputs/flutter-apk/app-release.apk

  ios:
    # No Mac in the FEMME fleet: this runner is the iOS build. Unsigned: sign with your own
    # certificate (Xcode, AltStore, Sideloadly) or point `flutter build ipa` at a team.
    runs-on: macos-15
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      # The image's default Xcode (16.4) is too old for the pinned plugins' Swift
      # (video_player_avfoundation 2.12 uses `isolation:`); the newest Xcode 26 on the image.
      - run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)" && xcodebuild -version
      - run: flutter build ios --release --no-codesign
        working-directory: mobile/app
      - name: package the unsigned app
        run: |
          cd mobile/app/build/ios/iphoneos
          mkdir Payload && cp -r Runner.app Payload/
          zip -qr femme-ios-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: femme-ios-unsigned
          path: mobile/app/build/ios/iphoneos/femme-ios-unsigned.ipa

  # Proof that the APK runs on Android: boot an emulator (KVM on the Linux runner), install the
  # release APK, seed the pairing (host + the `ci-emulator` device token from the repo secret),
  # launch, screenshot every tab. Screens land in the `femme-android-screens` artifact.
  android-emulator:
    runs-on: ubuntu-24.04
    needs: android
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: femme-android
      - name: enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          FEMME_CI_TOKEN: ${{ secrets.FEMME_CI_TOKEN }}
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash mobile/ci/emulator-smoke.sh
      - uses: actions/upload-artifact@v4
        with:
          name: femme-android-screens
          path: screens/

  # Same proof on an iPhone simulator (a simulator build is separate from the device ipa).
  ios-simulator:
    runs-on: macos-15
    needs: test
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)" && xcodebuild -version
      - run: flutter build ios --simulator
        working-directory: mobile/app
      - name: boot, install, pair, screenshot
        env:
          FEMME_CI_TOKEN: ${{ secrets.FEMME_CI_TOKEN }}
        run: |
          set -eux
          bundle=org.exposureai.femmeMobile
          udid=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for k in sorted(d, reverse=True) for x in d[k] if "iPhone" in x["name"]))')
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl install "$udid" mobile/app/build/ios/iphonesimulator/Runner.app
          xcrun simctl spawn "$udid" defaults write "$bundle" flutter.host -string femme.exposureai.org
          xcrun simctl spawn "$udid" defaults write "$bundle" flutter.token -string "$FEMME_CI_TOKEN"
          xcrun simctl spawn "$udid" defaults write "$bundle" flutter.client_instance -int 222222222222
          mkdir -p screens
          xcrun simctl launch "$udid" "$bundle"
          # a debug build on a software-rendered simulator takes a while to compile its shaders
          sleep 75
          xcrun simctl io "$udid" screenshot screens/01-now.png
          sleep 30
          xcrun simctl io "$udid" screenshot screens/02-now-later.png
          xcrun simctl spawn "$udid" log show --last 2m --predicate 'process == "Runner"' --style compact > screens/runner.log || true
      - uses: actions/upload-artifact@v4
        with:
          name: femme-ios-screens
          path: screens/
